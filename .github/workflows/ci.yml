name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check docs (one H1 per doc, relative links resolve)
        run: python3 ci/check_docs.py
